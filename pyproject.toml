[project]
name = "robocon-arena"
version = "1.0.0"
description = "3D OpenGL visualisation of the ABU Robocon 2019 'Great Urtuu' arena and robots"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shrey Niraula" }]
dependencies = [
    "glfw>=2.7",
    "moderngl>=5.10",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyglm>=2.7",
]

[project.scripts]
robocon = "robocon.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robocon"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
